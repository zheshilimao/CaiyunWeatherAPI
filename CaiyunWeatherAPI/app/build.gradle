plugins { id 'com.android.application' }

android {
    namespace 'com.api.caiyunweather'
    compileSdk 35

    defaultConfig {
        applicationId 'com.api.caiyunweather'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '1.2.3'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // AndroidX 依赖会带入 Kotlin 标准库；统一使用一个版本。
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

// Kotlin 1.6.x 的 jdk7/jdk8 标准库与 1.8.x 的 stdlib 会产生 Duplicate class。
// 当前项目是 Java 项目，不需要单独的 kotlin-stdlib-jdk7/jdk8。
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
