    CAIYUN = NATIVE_CONFIG.getApiKey() || '';

<style>
*{box-sizing:border-box}
body{margin:0;color:#fff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 80% 5%,#4387bd 0,#0b4e82 28%,#071b3d 72%);min-height:100vh;

/* ============================================================
   ① 状态栏毛玻璃层：fixed，只盖住状态栏那一小块高度
      始终提供毛玻璃，防止内容上滑时与状态栏图标重合
   ============================================================ */
.status-glass{
  position:fixed;
  top:0;left:0;right:0;
  height:calc(var(--status-inset,0px) + 8px);
  z-index:200;
  pointer-events:none;
  background:linear-gradient(180deg,
    rgba(30,85,135,.55) 0%,
    rgba(23,79,130,.40) 70%,
    rgba(23,79,130,.20) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 65%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 0%,#000 65%,transparent 100%);
}

/* ============================================================
   ② 地址栏：普通文档流，随页面滚动，滚走不固定
   ============================================================ */
.top{
  position:relative;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:calc(8px + var(--status-inset,0px)) max(18px,calc((100vw - 1180px)/2 + 18px)) 12px;
  background:none;
  border:none;
}
.top::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(180deg,
    rgba(67,135,189,.44) 0%,
    rgba(32,95,150,.30) 42%,
    rgba(11,78,130,.13) 70%,
    rgba(7,27,61,0) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 46%,rgba(0,0,0,.55) 78%,transparent 100%);

.loc{

}
</style>

<body>
  <!-- ① 状态栏毛玻璃层：固定，只盖住状态栏那一小块 -->

  <!-- ② 地址栏：在文档流中，随页面滚动 -->

  <main class="page">
    <div id="app">加载中…</div>
  </main>

<script>
/* ============================================================
 *  以下为页面逻辑，一般不用改。配置已经在 <head> 里。
 * ============================================================ */

const SUNRISE_ICON=`<svg viewBox="0 0 22 16" width="18" height="14" fill="none">
  <line x1="1" y1="13" x2="21" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 5.5 13 A 5.5 5.5 0 0 1 16.5 13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 11 8.2 L 11 3.2 M 8.2 5.8 L 11 3.2 L 13.8 5.8"
        stroke="currentColor" stroke-width="1.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

const SUNSET_ICON=`<svg viewBox="0 0 22 16" width="18" height="14" fill="none">
  <line x1="1" y1="13" x2="21" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 5.5 13 A 5.5 5.5 0 0 1 16.5 13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 11 3.2 L 11 8.2 M 8.2 5.8 L 11 8.2 L 13.8 5.8"
        stroke="currentColor" stroke-width="1.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

const UV_ICON = `<svg viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
  <circle cx="12" cy="12" r="3.4"/>
  <line x1="12" y1="2.5" x2="12" y2="5"/>
  <line x1="12" y1="19" x2="12" y2="21.5"/>
  <line x1="2.5" y1="12" x2="5" y2="12"/>
  <line x1="19" y1="12" x2="21.5" y2="12"/>
  <line x1="5.3" y1="5.3" x2="7.2" y2="7.2"/>
  <line x1="16.8" y1="16.8" x2="18.7" y2="18.7"/>
  <line x1="5.3" y1="18.7" x2="7.2" y2="16.8"/>
  <line x1="16.8" y1="7.2" x2="18.7" y2="5.3"/>
</svg>`;

const SM={
  CLEAR_DAY:['☀️','晴'],CLEAR_NIGHT:['🌙','晴'],
  PARTLY_CLOUDY_DAY:['🌤️','多云'],PARTLY_CLOUDY_NIGHT:['🌙','多云'],
  CLOUDY:['☁️','阴'],
  LIGHT_RAIN:['🌦️','小雨'],MODERATE_RAIN:['🌧️','中雨'],
  HEAVY_RAIN:['🌧️','大雨'],STORM_RAIN:['⛈️','暴雨'],
  LIGHT_SNOW:['🌨️','小雪'],MODERATE_SNOW:['❄️','中雪'],
  HEAVY_SNOW:['❄️','大雪'],STORM_SNOW:['🌨️','暴雪'],
  FOG:['🌫️','雾'],HAZE:['😷','霾'],WIND:['💨','大风']
};

const $=id=>document.getElementById(id);
const num=(x,d=0)=>Number.isFinite(Number(x))?Number(x):d;
const sky=x=>SM[x]||['☁️',x||'未知'];
const pct=x=>Math.round(num(x)*100);

function jsonp(url){
  return new Promise((ok,no)=>{
    const cb='cb'+Date.now()+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>{s.remove();delete window[cb];no(Error('请求超时'))},15000);
    window[cb]=x=>{clearTimeout(t);s.remove();delete window[cb];ok(x)};
    s.onerror=()=>{clearTimeout(t);s.remove();delete window[cb];no(Error('API请求失败'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}

function windLevel(v){
  v=num(v);
  const a=[0,1,6,12,20,29,39,50,62,75,89,103,118];
  const n=['无风','微风拂面','清风徐来','树叶摇摆','树枝摇动','风力强劲','风力强劲',
           '风力超强','狂风大作','狂风呼啸','暴风','暴风','飓风'];
  let i=0;for(let j=0;j<a.length;j++) if(v>=a[j]) i=j;
  return i+'级 · '+v.toFixed(1)+' km/h · '+n[i]+'';
}
function windDir(v){
  v=num(v);
  const dirs=['北风','东北风','东风','东南风','南风','西南风','西风','西北风'];
  const idx=Math.round(((v%360)+360)%360/45)%8;
  return dirs[idx];
}
function temp(d){
  if(!d) return [0,0];
  if(d.min!=null && d.max!=null) return [num(d.min), num(d.max)];
  if(d.temperature) return [num(d.temperature.min), num(d.temperature.max)];
  return [0,0];
}
function ds(d){
  if(d==null) return 'CLOUDY';
  if(typeof d==='string') return d;
  if(typeof d.skycon==='string') return d.skycon;
  if(d.skycon&&typeof d.skycon.value==='string') return d.skycon.value;
  if(typeof d.value==='string') return d.value;
  return 'CLOUDY';
}
function dayName(x,i){
  if(i===0) return '今天'; if(i===1) return '明天'; if(i===2) return '后天';
  const d=new Date(x);
  if(isNaN(d.getTime())) return '';
  return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
}
function mdStr(x){
  if(!x) return '';
  const d=new Date(x);
  if(isNaN(d.getTime())){
    const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(x));
    if(m) return `${Number(m[2])}/${Number(m[3])}`;
    return '';
  }
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function hTime(x){return x.datetime || x.time;}
function hasRainInHours(hp, hours){
  if(!Array.isArray(hp)||!hp.length) return false;
  const n=Math.min(hours, hp.length);
  for(let i=0;i<n;i++){
    if(num(hp[i].value)>0.031) return true;
  }
  return false;
}

/* ============ 逐时图表 ============ */
let chartObj=null, chartRange=[0,1], chartTimes=[], chartCount=0;

const HUM_ROW_RATIO=0.22;
const TEMP_TOP_PCT=0.42;
const TEMP_SPAN_PCT=0.22;

const tempLabelPlugin={
  id:'tempLabelPlugin',
  afterDatasetsDraw(chart){
    const idx=chart.data.datasets.findIndex(d=>d.label==='气温');
    if(idx<0) return;
    const meta=chart.getDatasetMeta(idx);
    if(!meta||!meta.data) return;
    const arr=chart.data.datasets[idx].data;
    const ctx=chart.ctx;
    const area=chart.chartArea;
    ctx.save();
    ctx.font='700 12px system-ui,-apple-system,sans-serif';
    ctx.fillStyle='#ffc271';
    ctx.textAlign='center';
    ctx.textBaseline='bottom';
    meta.data.forEach((pt,i)=>{
      if(pt.x<area.left-6||pt.x>area.right+6) return;
      ctx.fillText(Math.round(arr[i])+'°', pt.x, pt.y-8);
    });
    ctx.restore();
  }
};

const humidityRowPlugin={
  id:'humidityRowPlugin',
  afterDatasetsDraw(chart){
    const idx=chart.data.datasets.findIndex(d=>d.label==='湿度');
    if(idx<0) return;
    const meta=chart.getDatasetMeta(idx);
    if(!meta||!meta.data||!meta.data.length) return;
    const arr=chart.data.datasets[idx].data;
    const ctx=chart.ctx;
    const area=chart.chartArea;
    const rowY=area.bottom-(area.bottom-area.top)*HUM_ROW_RATIO;

    ctx.save();
    ctx.font='600 12px system-ui,-apple-system,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='#c8e4ff';
    meta.data.forEach((pt,i)=>{
      if(pt.x<area.left-4||pt.x>area.right+4) return;
      ctx.fillText(Math.round(arr[i])+'%', pt.x, rowY);
    });
    ctx.restore();
  }
};

function drawChart(hourly){
  const temps=(hourly.temperature||[]).slice(0,48);
  const hums =(hourly.humidity   ||[]).slice(0,48);
  const precs=(hourly.precipitation||[]).slice(0,48);
  const cv=$('chart');
  if(!cv||!temps.length) return;

  chartTimes=temps.map(x=>hTime(x));
  chartCount=temps.length;

  const labels=temps.map(x=>{
    const d=new Date(hTime(x));
    return isNaN(d.getTime())?'--:--':String(d.getHours()).padStart(2,'0')+':00';
  });
  const tvals=temps.map(x=>num(x.value));
  const hvals=hums.length?hums.map(x=>pct(x.value)):null;
  const pvals=precs.map(x=>num(x.value));

  const tMin=Math.min(...tvals);
  const tMax=Math.max(...tvals);
  const tSpan=Math.max(tMax-tMin, 1.5);
  const range=tSpan/TEMP_SPAN_PCT;
  const yMax=tMax+TEMP_TOP_PCT*range;
  const yMin=yMax-range;

  const pMax=Math.max(...pvals,0.1);
  chartRange=[yMin,yMax];

  if(chartObj){chartObj.destroy();chartObj=null;}

  const datasets=[
    {type:'bar',label:'降水',data:pvals,yAxisID:'y1',
     backgroundColor:'#4ebcff33',borderColor:'#4ebcff77',borderWidth:1,
     borderRadius:3,barPercentage:.6,order:3},
    {type:'line',label:'气温',data:tvals,yAxisID:'y',
     borderColor:'#ffb34f',borderWidth:2.6,
     pointRadius:4,pointHoverRadius:6,
     pointBackgroundColor:'#ffb34f',
     pointBorderColor:'#0b1e3a',pointBorderWidth:1.6,
     tension:.4,fill:true,order:1,
     backgroundColor:c=>{
       const a=c.chart.chartArea, cc=c.chart.ctx;
       if(!a) return 'rgba(255,179,79,.15)';
       const g=cc.createLinearGradient(0,a.top,0,a.bottom);
       g.addColorStop(0,'rgba(255,179,79,.22)');
       g.addColorStop(1,'rgba(255,179,79,0)');
       return g;
     }}
  ];

  if(hvals){
    datasets.push({
      type:'line',label:'湿度',data:hvals,yAxisID:'y2',
      borderColor:'transparent',pointRadius:0,fill:false,order:2
    });
  }

  chartObj=new Chart(cv,{
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:0},
      events:[],
      interaction:{mode:null,intersect:false},
      layout:{padding:{top:16,right:14,bottom:2,left:0}},
      plugins:{
        legend:{display:false},
        tooltip:{enabled:false}
      },
      scales:{
        x:{grid:{display:false},
           ticks:{color:'#b9cee0',maxRotation:0,autoSkip:true,maxTicksLimit:24,font:{size:11}}},
        y:{display:false,min:yMin,max:yMax},
        y1:{display:false,min:0,max:pMax*4,position:'right'},
        y2:{display:false,min:0,max:100,position:'right'}
      }
    },
    plugins:[tempLabelPlugin, humidityRowPlugin]
  });

  requestAnimationFrame(paintYAxisLabels);
  bindHourlyScroll();
}

function paintYAxisLabels(){
  if(!chartObj||!chartObj.chartArea) return;
  const area=chartObj.chartArea;
  const el=$('yaxis'); if(!el) return;
  const tempCenter=TEMP_TOP_PCT+TEMP_SPAN_PCT/2;
  const tempY=area.top+(area.bottom-area.top)*tempCenter;
  const humY=area.bottom-(area.bottom-area.top)*HUM_ROW_RATIO;
  el.innerHTML=
    `<span class="lbl-temp" style="top:${tempY.toFixed(1)}px">温度</span>`+
    `<span class="lbl-hum"  style="top:${humY.toFixed(1)}px">湿度</span>`;
}

function bindHourlyScroll(){
  const scroller=document.getElementById('chartScroll');
  const badge=document.getElementById('hourlyDate');
  if(!scroller||!badge) return;

  const update=()=>{
    if(!chartTimes.length) return;
    const totalW=scroller.firstElementChild
      ? scroller.firstElementChild.offsetWidth : 1440;
    const innerW=totalW-14;
    const spacing=innerW/Math.max(chartCount-1,1);

    const idx=Math.max(0,Math.min(chartCount-1,
      Math.floor(scroller.scrollLeft/spacing)));

    const d=new Date(chartTimes[idx]);
    if(isNaN(d.getTime())) return;
    const dn=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    badge.textContent=`${d.getMonth()+1}/${d.getDate()} ${dn}`;
  };

  scroller.onscroll=update;
  update();
}

let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(chartObj) requestAnimationFrame(()=>{
      paintYAxisLabels();
      bindHourlyScroll();
    });
  },120);
});

/* ============ 降水预报 ============ */
function rainLevel(v){
  if(v<0.031) return 'none';
  if(v<0.25)  return 'light';
  if(v<0.35)  return 'mid';
  if(v<0.48)  return 'heavy';
  return 'storm';
}
function buildBars(values, maxV){
  return values.map(v=>{
    if(v < 0.031) return `<i style="height:4%"></i>`;
    const h = Math.max(10, Math.min(100, v/maxV*100));
    return `<i class="${rainLevel(v)}" style="height:${h.toFixed(0)}%"></i>`;
  }).join('');
}

function renderRainSection(r){
  const minutely = r.minutely || {};
  const md = minutely.precipitation_2h || [];
  const hp = (r.hourly?.precipitation) || [];

  const hasMinutelyRain = Array.isArray(md) && md.some(v=>num(v)>0.031);
  const hasHourlyRain24 = hasRainInHours(hp, 24);

  if(!hasMinutelyRain && !hasHourlyRain24){
    return '';
  }

  if(hasMinutelyRain){
    const desc = minutely.description || '未来两小时降水情况';
    const buckets=[];
    for(let i=0;i<120;i+=5){
      let sum=0,n=0;
      for(let j=i;j<i+5 && j<md.length;j++){ sum+=num(md[j]); n++; }
      buckets.push(n?sum/n:0);
    }
    const maxRain = Math.max(...buckets, 0.3);
    const bars = buildBars(buckets, maxRain);
    const rainyHours = hp.filter(x=>num(x.value)>0.031).length;
    const hint = rainyHours>0
      ? `未来 48 小时内有 ${rainyHours} 个小时可能出现降水`
      : '未来 48 小时无明显降水';

    return `<section class="card section">
      <div class="st"><span>降水预报</span><small>未来 2 小时 · 每格 5 分钟</small></div>
      <div class="rain-desc">${desc}</div>
      <div class="rain-bars">${bars}</div>
      <div class="rain-scale">
        <span>现在</span><span>30 分</span><span>1 时</span>
        <span>1 时 30 分</span><span>2 时</span>
      </div>
      <div class="rain-hint">${hint}</div>
    </section>`;
  }

  const vals = hp.slice(0,24).map(x=>num(x.value));
  const maxRain = Math.max(...vals, 0.3);
  const bars = buildBars(vals, maxRain);
  const now = new Date();
  const last = new Date(now.getTime()+23*3600*1000);
  const lastLabel = last.getDate()===now.getDate()
    ? last.getHours()+' 时'
    : '次日 '+last.getHours()+' 时';

  return `<section class="card section">
    <div class="st"><span>降水预报</span><small>未来 24 小时 · 逐小时</small></div>
    <div class="rain-desc">未来 24 小时降水强度（mm/h）</div>
    <div class="rain-bars">${bars}</div>
    <div class="rain-scale">
      <span>现在</span><span>6 时</span><span>12 时</span>
      <span>18 时</span><span>${lastLabel}</span>
    </div>
    <div class="rain-hint">未来 2 小时无降水，显示未来 24 小时逐小时预报</div>
  </section>`;
}

function openSettings(){
  if(NATIVE_CONFIG && NATIVE_CONFIG.openSettings) NATIVE_CONFIG.openSettings();
}

/* ============ 主渲染 ============ */
function draw(d){
  const r=d.result||{};
  const rt=r.realtime||{}, h=r.hourly||{}, dy=r.daily||{};

  const dayTemps = dy.temperature   || [];
  const daySky   = dy.skycon        || [];
  const dayAstro = dy.astro         || [];

  const today = temp(dayTemps[0]);
  const s = sky(rt.skycon);
  const w = rt.wind||{};
  const aq= rt.air_quality||{};
  const vis = num(rt.visibility);
  const cloud = pct(rt.cloudrate);
  const aqiChn= aq.aqi?.chn ?? '--';
  const aqiDesc= aq.description?.chn||'';

  const astro=dayAstro[0]||{};
  const sr=astro.sunrise?.time||'—';
  const ss=astro.sunset?.time||'—';

  let uvIdx = null;
  const rtUV = rt.life_index && rt.life_index.ultraviolet;
  const dailyUVArr = (dy.life_index && dy.life_index.ultraviolet) || [];

  if(rtUV && rtUV.index != null){
    uvIdx = Number(rtUV.index);
  }else if(dailyUVArr[0] && dailyUVArr[0].index != null){
    uvIdx = Number(dailyUVArr[0].index);
  }

  const uvBadge = (uvIdx !== null && isFinite(uvIdx))
    ? `<span class="uv-badge">${UV_ICON}紫外线<b>${uvIdx}</b></span>`
    : '';

  $('loc').textContent=PLACE_NAME;
  $('upd').textContent='↻ 更新 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});

  const hero=`<section class="hero card">
    <div class="hero-temp">${rt.temperature!=null?num(rt.temperature).toFixed(1):'--'}<small>°</small></div>
    <div class="hero-sky"><span class="hero-icon">${s[0]}</span><span>${s[1]}</span></div>
    <div class="hero-range">最高 ${today[1].toFixed(1)}° · 最低 ${today[0].toFixed(1)}°</div>
  </section>`;

  const metrics=[
    `<div class="card metric">
       <div class="mi">🌡️</div>
       <div><div class="ml">体感</div><div class="mv">${num(rt.apparent_temperature).toFixed(1)}°</div><div class="ms">体感温度</div></div>
     </div>`,
    `<div class="card metric">
       <div class="mi">💨</div>
       <div>
         <div class="ml">风向</div>
         <div class="mv">${windDir(w.direction)}</div>
         <div class="ms">${windLevel(w.speed)}</div>
       </div>
     </div>`,
    `<div class="card metric">
       <div class="mi">💧</div>
       <div><div class="ml">湿度</div><div class="mv">${pct(rt.humidity)}%</div><div class="ms">相对湿度</div></div>
     </div>`,
    `<div class="card metric">
       <div class="mi">🍃</div>
       <div><div class="ml">空气质量</div><div class="mv">${aqiChn}</div><div class="ms">${aqiDesc||'AQI · 中国标准'}</div></div>
     </div>`,
    `<div class="card metric metric-sun">
       <div class="mi">☀️</div>
       <div class="ms-body">
         <div class="ml">日出 · 日落</div>
         <div class="ms-times">
           <span class="sun-icon" style="color:#ffc271">${SUNRISE_ICON}</span>
           <span class="rise">${sr}</span>
           <span class="sep">/</span>
           <span class="set">${ss}</span>
           <span class="sun-icon" style="color:#ff9f5a">${SUNSET_ICON}</span>
         </div>
       </div>
     </div>`,
    `<div class="card metric">
       <div class="mi">👁️</div>
       <div>
         <div class="ml">能见度</div>
         <div class="mv">${vis.toFixed(1)} km</div>
         <div class="ms">卫星云图总云量 ${cloud}%</div>
       </div>
     </div>`
  ].join('');

  const count=Math.min(dayTemps.length,3);
  const slice=dayTemps.slice(0,count);
  const allLo=Math.min(...slice.map(x=>temp(x)[0]));
  const allHi=Math.max(...slice.map(x=>temp(x)[1]));
  const span=Math.max(allHi-allLo,1);

  let dayRows='';
  for(let i=0;i<count;i++){
    const t=dayTemps[i];
    const z=temp(t);
    const dateKey = t.date || t.fxDate;
    const q = sky(ds(daySky[i]));
    const week = dayName(dateKey, i);
    const md = mdStr(dateKey);

    const left  = ((z[0]-allLo)/span)*100;
    const width = ((z[1]-z[0])/span)*100;

    let marker='';
    if(i===0 && rt.temperature!=null){
      const cur=num(rt.temperature);
      const pos=((cur - z[0]) / Math.max(z[1]-z[0],0.01));
      if(pos>=0 && pos<=1){
        marker=`<span class="day-marker" style="left:${(pos*100).toFixed(1)}%"></span>`;
      }
    }

    dayRows+=`<div class="day-row">
      <div class="day-label">
        <div class="dl-top">
          <b>${week}</b>
          <span>${md}</span>
        </div>
        <div class="dl-bot">${q[1]}</div>
      </div>
      <div class="day-icon">${q[0]}</div>
      <div class="day-lo">${z[0].toFixed(1)}°</div>
      <div class="day-bar-wrap">
        <div class="day-bar">
          <i style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></i>
          ${marker}
        </div>
      </div>
      <div class="day-hi">${z[1].toFixed(1)}°</div>
    </div>`;
  }

  const hasRain24h = hasRainInHours(h.precipitation, 24);
  const noRainBadge = hasRain24h ? '' :
    `<span class="no-rain-badge">未来短时间内<b>无降水</b></span>`;

  const html=
    hero+
    `<section class="grid">${metrics}</section>`+
    renderRainSection(r)+
    `<section class="card section">
       <div class="hourly-head">
         <div class="htitle">逐时预报</div>
       </div>
       <div class="hourly-badges">
         <span class="hourly-date" id="hourlyDate">--</span>
         ${uvBadge}
         ${noRainBadge}
       </div>
       <div class="chart-wrap">
         <div class="y-axis" id="yaxis"></div>
         <div class="chart-scroll" id="chartScroll">
           <div class="chartbox"><canvas id="chart"></canvas></div>
         </div>
       </div>
     </section>`+
    `<section class="card section">
       <div class="st"><span>未来 48 小时天气</span></div>
       <div class="days-v">${dayRows}</div>
     </section>`+
    `<div class="foot">彩云天气API · 实况 + 逐时预报 + 未来48小时天气。每 ${REFRESH_MIN} 分钟自动刷新。</div>`;

  $('app').innerHTML=html;
  drawChart(h);
}

const WEATHER_CACHE_KEY = 'caiyun_weather_cache_v1';

function readWeatherCache(){
  try{
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if(!raw) return null;
    const item = JSON.parse(raw);
    if(!item || !item.data || item.data.status !== 'ok') return null;
    return item;
  }catch(e){ return null; }
}

function saveWeatherCache(data){
  try{
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      location: LOCATION,
      place: PLACE_NAME,
      data: data
    }));
  }catch(e){}
}

function showCachedWeather(){
  const cache = readWeatherCache();
  if(!cache) return false;
  try{
    // 缓存优先：先把上次完整天气直接画出来，再让后台请求更新。
    draw(cache.data);
    return true;
  }catch(e){
    return false;
  }
}

let nativeWeatherWaiters = [];
let nativeWeatherTimer = null;
let hasVisibleWeather = false;

window.onNativeWeatherResult = function(jsonText){
  try {
    const data = JSON.parse(jsonText);
    if(!data || data.status !== 'ok') throw Error((data && data.error) || 'API 返回异常');
    saveWeatherCache(data);
    draw(data);
    hasVisibleWeather = true;
    const waiters = nativeWeatherWaiters.splice(0);
    if(nativeWeatherTimer){ clearTimeout(nativeWeatherTimer); nativeWeatherTimer=null; }
    waiters.forEach(resolve=>resolve(true));
  } catch(e) {
    window.onNativeWeatherError(e.message || '天气数据解析失败');
  }
};

window.onNativeWeatherError = function(message){
  const waiters = nativeWeatherWaiters.splice(0);
  if(nativeWeatherTimer){ clearTimeout(nativeWeatherTimer); nativeWeatherTimer=null; }
  // 有缓存时保留旧天气，不要因为一次网络/定位失败把已经显示的页面清空。
  if(hasVisibleWeather || readWeatherCache()){
    waiters.forEach(resolve=>resolve(false));
    return;
  }
  $('app').innerHTML='<div class="card err">天气数据获取失败：'+String(message||'API请求失败')+
    '<br>请检查 API Key、API 地址和经纬度。</div>';
  waiters.forEach(resolve=>resolve(false));
};

async function load(options){
  const background = !!(options && options.background);
  try {
    syncNativeConfig();

    // 正常启动：缓存立即显示；随后继续后台请求。
    if(!hasVisibleWeather) hasVisibleWeather = showCachedWeather();

    if(!CAIYUN.trim()) throw Error('尚未填写 API Key，请进入右上角“设置”填写。');
    if(!LOCATION.trim() || LOCATION === '0,0') throw Error('尚未设置有效位置，请进入“设置”开启自动定位或填写经纬度。');

    if(window.NativeWeather && window.NativeWeather.requestWeather){
      return await new Promise(resolve=>{
        nativeWeatherWaiters.push(resolve);
        if(!nativeWeatherTimer){
          nativeWeatherTimer=setTimeout(()=>window.onNativeWeatherError('请求超时，请检查网络连接或 API 设置'),20000);
        }
        try {
          const started=window.NativeWeather.requestWeather();
          if(started===false) window.onNativeWeatherError('无法启动天气请求');
        } catch(e) {
          window.onNativeWeatherError(e.message || '无法启动天气请求');
        }
      });
    }

  // Browser fallback for previewing the HTML outside the Android app.
  try{
    const base=String(API_BASE||'').replace(/\/+$/,'');
    const url=`${base}/${CAIYUN}/${LOCATION}/weather?dailysteps=3&hourlysteps=48&lang=zh_CN`;
    const d=await jsonp(url);
    if(!d||d.status!=='ok') throw Error((d&&(d.error||d.message))||'API返回异常');
    draw(d);
    return true;
  }catch(e){
    if(!hasVisibleWeather) {
      $('app').innerHTML='<div class="card err">天气数据获取失败：'+e.message+
        '<br>请检查 API Key、API 地址和经纬度。</div>';
    }
    return false;
  }
  } catch(e) {
    if(!hasVisibleWeather) {
      $('app').innerHTML='<div class="card err">天气数据获取失败：'+String(e && e.message || 'API请求失败')+'<br>请检查 API Key、API 地址和经纬度。</div>';
    }
    return false;
  }
}

window.refreshWeather = async function(){
  try {
    return await load({background:false});
  } finally {
    if (window.AndroidConfig && window.AndroidConfig.refreshFinished) {
      window.AndroidConfig.refreshFinished();
    }
  }
};

let autoRefreshTimer = null;
let autoRefreshPaused = false;

function scheduleAutoRefresh(){
  clearTimeout(autoRefreshTimer);
  autoRefreshTimer = null;
  if(autoRefreshPaused) return;
  const minutes = Math.max(1, Number(REFRESH_MIN) || 5);
  autoRefreshTimer = setTimeout(async ()=>{
    if(autoRefreshPaused) return;
    await load({background:true});
    scheduleAutoRefresh();
  }, minutes * 60000);
}

window.pauseAutoRefresh = function(){
  autoRefreshPaused = true;
  clearTimeout(autoRefreshTimer);
  autoRefreshTimer = null;
};

window.resumeAutoRefresh = function(){
  autoRefreshPaused = false;
  scheduleAutoRefresh();
};

// 首次进入：先显示本地缓存，再后台请求最新天气。
load({background:true});
scheduleAutoRefresh();
</script>
